<title>Atelier OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : barre de commande en haut, onglets, vue principale ; le Bureau montre les agents à leur poste + le fil d'activité */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --sunk: #e3e8f0;
  --ink: #1b2333;
  --muted: #5d6b82;
  --line: #d4dbe6;
  --accent: #3b5bdb;
  --accent-soft: #e5ebff;
  --st-new: #5c7cfa;
  --st-sent: #e8890c;
  --st-reply: #0c8599;
  --st-client: #2f9e44;
  --work: #2f9e44;
  --lake: #cfe0f5;
  --road: #ffffff;
  --map: #e7ecf3;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161f; --surface: #19202d; --sunk: #0d1119; --ink: #e5e9f1; --muted: #93a0b7;
    --line: #2a3345; --accent: #7b93ff; --accent-soft: #232d4a;
    --st-new: #7b93ff; --st-sent: #f5a524; --st-reply: #3bc9db; --st-client: #51cf66; --work: #51cf66;
    --lake: #1c3150; --road: #2b3446; --map: #161d29;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161f; --surface: #19202d; --sunk: #0d1119; --ink: #e5e9f1; --muted: #93a0b7;
  --line: #2a3345; --accent: #7b93ff; --accent-soft: #232d4a;
  --st-new: #7b93ff; --st-sent: #f5a524; --st-reply: #3bc9db; --st-client: #51cf66; --work: #51cf66;
  --lake: #1c3150; --road: #2b3446; --map: #161d29;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; font-weight: 600; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* barre du haut */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; color: var(--surface); font-family: var(--font-display); font-weight: 700; }
.brand h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; display: grid; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { color: var(--accent); background: var(--accent-soft); text-decoration: none; font-weight: 600; font-size: .85rem; padding: 7px 12px; border-radius: 9px; }
.links a:hover { text-decoration: underline; }
.stat b { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 500; }

/* onglets */
nav { overflow-x: auto; }
nav ul { list-style: none; margin: 0; padding: 4px; display: flex; gap: 4px; background: var(--sunk); border-radius: 12px; width: max-content; min-width: 100%; }
nav a { display: block; padding: 8px 14px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
nav a:hover { color: var(--ink); }
nav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

/* bureau */
.hq { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.hq .who { display: flex; gap: 12px; align-items: center; flex: 1 1 260px; }
.cmd { font-family: var(--font-mono); font-size: .85rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; flex: 1 1 280px; min-width: 0; overflow-x: auto; white-space: nowrap; }
.rooms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .rooms { grid-template-columns: 1fr; } }
.room { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; align-content: start;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px; background-position: -1px -1px; }
.room-head { display: flex; justify-content: space-between; align-items: baseline; background: var(--surface); padding: 2px 4px; border-radius: 6px; }
.desk { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 700; position: relative; }
.avatar.lg { width: 52px; height: 52px; font-size: 1.2rem; }
.desk.working .avatar::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--work); border: 2px solid var(--surface); }
.desk .name { font-weight: 600; }
.desk .mission { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
.screen { width: 46px; height: 32px; border-radius: 5px; background: var(--sunk); border: 1px solid var(--line); padding: 5px; display: grid; gap: 3px; align-content: start; }
.screen i { display: block; height: 3px; border-radius: 2px; background: var(--line); }
.desk.working .screen i { background: var(--work); animation: type 1.6s ease-in-out infinite; transform-origin: left; }
.desk.working .screen i:nth-child(2) { animation-delay: .3s; }
.desk.working .screen i:nth-child(3) { animation-delay: .6s; }
@keyframes type { 0% { transform: scaleX(.15); } 60% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: .35; } }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.work { color: var(--work); }
.pill.st-a_contacter { color: var(--st-new); } .pill.st-contacte { color: var(--st-sent); }
.pill.st-repondu { color: var(--st-reply); } .pill.st-client { color: var(--st-client); }
.pill.ex { border-style: dashed; }
.pill.ex::before { display: none; }

.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.feed li { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; font-size: .9rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.feed time { display: block; font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }

/* carte */
.map-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); }
.map { display: block; width: 100%; min-width: 520px; height: auto; background: var(--map); }
.map .lake { fill: var(--lake); }
.map .road { stroke: var(--road); stroke-width: 7; fill: none; stroke-linecap: round; }
.map .gridl { stroke: var(--line); stroke-width: 1; }
.map .zone { fill: var(--muted); font: 600 11px var(--font-body); letter-spacing: .06em; text-transform: uppercase; }
.map .lake-t { fill: var(--st-new); font: italic 12px var(--font-body); }
.map .pin { cursor: pointer; }
.map .pin circle.core { stroke: var(--surface); stroke-width: 2.5; }
.map .pin.sel circle.ring { animation: ping 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ping { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.8); opacity: 0; } }
.map .compass { fill: var(--muted); font: 600 11px var(--font-mono); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.detail { display: grid; gap: 6px; }
.detail dl { margin: 0; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; font-size: .9rem; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; overflow-wrap: anywhere; }

/* listes & tableaux */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.score { font-family: var(--font-mono); }

.kanban { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; align-items: start; }
@media (max-width: 760px) { .kanban { grid-template-columns: 1fr; } }
.col { background: var(--sunk); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .78rem; color: var(--muted); }
.tag { font-size: .72rem; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.tag.etudes { background: var(--sunk); color: var(--st-client); border: 1px solid var(--line); }

.empty { color: var(--muted); font-size: .9rem; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; }
.notice { font-size: .85rem; color: var(--muted); }
.err { background: var(--surface); border: 1px solid var(--st-sent); border-radius: 12px; padding: 16px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">A</div>
      <div>
        <h1>Atelier OS</h1>
        <div class="muted" id="maj">Chargement…</div>
      </div>
    </div>
    <div class="links" id="links"></div>
    <div class="stats" id="stats"></div>
  </header>

  <nav aria-label="Vues">
    <ul>
      <li><a href="#bureau">Bureau</a></li>
      <li><a href="#carte">Carte</a></li>
      <li><a href="#taches">Tâches</a></li>
      <li><a href="#prospects">Prospects</a></li>
      <li><a href="#clients">Clients</a></li>
      <li><a href="#contenu">Contenu</a></li>
      <li><a href="#etudes">Études</a></li>
    </ul>
  </nav>

  <main id="view"></main>
  <p class="notice">Les éléments marqués « exemple » sont fictifs. Ils seront remplacés quand les agents rapporteront de vraies données. Pour lancer une mission, tape <span class="mono">/chef …</span> dans Claude Code.</p>
</div>

<script>
const VIEWS = ["bureau", "carte", "taches", "prospects", "clients", "contenu", "etudes"];
const STATUTS = { a_contacter: "À contacter", contacte: "Contacté", repondu: "A répondu", client: "Client" };
const COL = { a_faire: "À faire", en_cours: "En cours", fait: "Fait" };
let S = null;
let selected = null;

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ex = (o) => (o && o.exemple ? ' <span class="pill ex">exemple</span>' : "");
const fmtDate = (d) => {
  if (!d) return "";
  const t = new Date(d);
  if (isNaN(t)) return esc(d);
  return t.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) + (String(d).includes("T") ? " · " + t.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "");
};
const euro = (n) => (n == null ? "—" : Number(n).toLocaleString("fr-FR") + " €");
const agent = (id) => (S.agents || []).find((a) => a.id === id) || { nom: id, couleur: "#868e96" };
const empty = (txt) => `<div class="empty">${txt}</div>`;

function desk(a) {
  const w = a.statut === "travail";
  return `<div class="desk ${w ? "working" : ""}">
    <div class="avatar" style="background:${esc(a.couleur)}">${esc(a.nom[0])}</div>
    <div style="min-width:0">
      <div class="name">${esc(a.nom)} <span class="muted" style="font-weight:400">· ${esc(a.role)}</span></div>
      <div class="mission">${w ? esc(a.mission) : "Disponible"}</div>
    </div>
    <div style="display:grid;gap:6px;justify-items:end">
      <div class="screen" aria-hidden="true"><i></i><i></i><i></i></div>
      <span class="pill ${w ? "work" : ""}">${w ? "Au travail" : "Au repos"}</span>
    </div>
  </div>`;
}

function vBureau() {
  const chef = agent("chef");
  const room = (eq, titre) => {
    const list = S.agents.filter((a) => a.equipe === eq);
    const busy = list.filter((a) => a.statut === "travail").length;
    return `<section class="room"><div class="room-head"><h2>${titre}</h2><span class="label">${busy}/${list.length} au travail</span></div>${list.map(desk).join("")}</section>`;
  };
  const feed = (S.activite || []).slice(0, 14).map((e) => `<li><span class="dot" style="background:${esc(agent(e.agent).couleur)}"></span><div><time>${fmtDate(e.date)} · ${esc(agent(e.agent).nom)}</time>${esc(e.texte)}</div></li>`).join("");
  const enCours = (S.missions || []).filter((m) => m.statut === "en_cours");
  return `<div class="grid-2">
    <div style="display:grid;gap:16px;min-width:0">
      <div class="hq">
        <div class="who"><div class="avatar lg" style="background:${esc(chef.couleur)}">C</div>
          <div><div class="label">Bureau du chef</div><h2>Le chef répartit les missions</h2>
          <div class="muted">${enCours.length} mission${enCours.length > 1 ? "s" : ""} en cours</div></div></div>
        <div class="cmd">/chef prospecte 3 fleuristes à Seynod</div>
      </div>
      <div class="rooms">${room("business", "Équipe Business")}${room("etudes", "Équipe Études")}</div>
    </div>
    <aside class="panel"><h2>Activité récente</h2>${feed ? `<ul class="feed">${feed}</ul>` : empty("Aucune activité pour l'instant.")}</aside>
  </div>`;
}

function vCarte() {
  const P = S.prospects || [];
  if (!selected && P.length) selected = P[0].id;
  const sel = P.find((p) => p.id === selected);
  const grid = [];
  for (let x = 40; x < 600; x += 40) grid.push(`<line class="gridl" x1="${x}" y1="0" x2="${x}" y2="400"/>`);
  for (let y = 40; y < 400; y += 40) grid.push(`<line class="gridl" x1="0" y1="${y}" x2="600" y2="${y}"/>`);
  const zones = (S.zones || []).map((z) => `<text class="zone" x="${z.x}" y="${z.y}" text-anchor="middle">${esc(z.nom)}</text>`).join("");
  const pins = P.map((p) => `<g class="pin ${p.id === selected ? "sel" : ""}" data-id="${esc(p.id)}" tabindex="0" role="button" aria-label="${esc(p.entreprise)}">
      <circle class="ring" cx="${p.x}" cy="${p.y}" r="14" fill="var(--st-${statutKey(p.statut)})" opacity="0"/>
      <circle class="core" cx="${p.x}" cy="${p.y}" r="9" fill="var(--st-${statutKey(p.statut)})"/>
    </g>`).join("");
  const legend = Object.entries(STATUTS).map(([k, v]) => `<span class="pill st-${k}">${v} · ${P.filter((p) => p.statut === k).length}</span>`).join("");
  const det = sel ? `<div class="detail">
      <div class="label">${esc(sel.secteur)} · ${esc(sel.zone)}</div>
      <h2>${esc(sel.entreprise)}${ex(sel)}</h2>
      <span class="pill st-${esc(sel.statut)}" style="justify-self:start">${STATUTS[sel.statut] || esc(sel.statut)}</span>
      <dl>
        <dt>Site</dt><dd>${sel.site ? esc(sel.site) : "Aucun"}</dd>
        <dt>Score</dt><dd class="score">${sel.score == null ? "non audité" : esc(sel.score) + "/100"}</dd>
        <dt>Problème</dt><dd>${esc(sel.probleme)}</dd>
        <dt>Contact</dt><dd>${esc(sel.contact)}</dd>
        ${sel.audit ? `<dt>Audit</dt><dd class="mono">${esc(sel.audit)}</dd>` : ""}
      </dl>
      ${sel.message ? `<div class="label">Message proposé</div><div class="card">${esc(sel.message)}</div>` : ""}
    </div>` : empty("Aucun prospect. Lance <span class='mono'>/chef prospecte …</span>");
  return `<div class="grid-2">
    <section class="panel">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline"><h2>Carte de prospection</h2><span class="label">Plan schématique · Annecy</span></div>
      <div class="map-wrap"><svg class="map" viewBox="0 0 600 400" role="img" aria-label="Plan schématique des prospects autour d'Annecy">
        ${grid.join("")}
        <path class="lake" d="M430 230 C470 220 500 250 505 290 C512 330 540 360 560 400 L470 400 C455 360 420 330 410 295 C400 262 405 236 430 230 Z"/>
        <text class="lake-t" x="488" y="330">Lac d'Annecy</text>
        <path class="road" d="M20 200 C140 210 230 205 300 215 C360 222 400 200 590 120"/>
        <path class="road" d="M300 20 C305 100 300 160 300 215 C290 280 240 330 210 395"/>
        <path class="road" d="M120 80 C170 140 230 190 300 215"/>
        ${zones}${pins}
        <text class="compass" x="575" y="28" text-anchor="middle">N</text>
        <path d="M575 34 L570 50 L575 46 L580 50 Z" fill="var(--muted)"/>
      </svg></div>
      <div class="legend">${legend}</div>
    </section>
    <aside class="panel">${det}</aside>
  </div>`;
}
function statutKey(s) { return { a_contacter: "new", contacte: "sent", repondu: "reply", client: "client" }[s] || "new"; }

function vTaches() {
  const T = S.taches || [];
  return `<div class="kanban">${Object.entries(COL).map(([k, v]) => {
    const items = T.filter((t) => t.colonne === k);
    return `<section class="col"><div style="display:flex;justify-content:space-between"><h2>${v}</h2><span class="label mono">${items.length}</span></div>
      ${items.map((t) => `<div class="card"><div>${esc(t.titre)}${ex(t)}</div><div class="meta"><span class="tag ${t.tag === "etudes" ? "etudes" : ""}">${t.tag === "etudes" ? "Études" : "Business"}</span>${t.source === "qg" ? '<span class="tag">aussi dans le QG</span>' : ""}${t.echeance ? `<span class="mono">${fmtDate(t.echeance)}</span>` : ""}</div></div>`).join("") || empty("Rien ici.")}
    </section>`;
  }).join("")}</div>`;
}

function vProspects() {
  const P = S.prospects || [];
  if (!P.length) return `<section class="panel">${empty("Aucun prospect.")}</section>`;
  return `<section class="panel"><h2>Prospects</h2><div class="table-wrap"><table>
    <thead><tr><th>Entreprise</th><th>Zone</th><th>Site</th><th style="text-align:right">Score</th><th>Problème</th><th>Statut</th></tr></thead>
    <tbody>${P.map((p) => `<tr><td><b>${esc(p.entreprise)}</b>${ex(p)}<div class="muted">${esc(p.secteur)}</div></td><td>${esc(p.zone)}</td><td>${p.site ? esc(p.site) : "—"}</td><td class="num">${p.score ?? "—"}</td><td>${esc(p.probleme)}</td><td><span class="pill st-${esc(p.statut)}">${STATUTS[p.statut] || esc(p.statut)}</span></td></tr>`).join("")}</tbody>
  </table></div></section>`;
}

function vClients() {
  const C = S.clients || [], Pr = S.propositions || [];
  const total = C.filter((c) => !c.exemple).reduce((s, c) => s + (Number(c.montant) || 0), 0);
  return `<div class="grid-2">
    <section class="panel"><h2>Clients</h2>${C.length ? `<div class="table-wrap"><table><thead><tr><th>Client</th><th>Projet</th><th>Statut</th><th style="text-align:right">Montant</th></tr></thead>
      <tbody>${C.map((c) => `<tr><td><b>${esc(c.nom)}</b>${ex(c)}</td><td>${esc(c.projet)}</td><td>${esc(c.statut).replace("_", " ")}</td><td class="num">${euro(c.montant)}</td></tr>`).join("")}</tbody></table></div>` : empty("Aucun client pour l'instant.")}
      <div class="label">Total réel (hors exemples) : <span class="mono">${euro(total)}</span></div></section>
    <section class="panel"><h2>Propositions</h2>${Pr.length ? Pr.map((p) => `<div class="card"><div><b>${esc(p.client)}</b>${ex(p)}</div><div>${esc(p.objet)}</div><div class="meta"><span class="mono">${euro(p.montant)}</span><span>· ${esc(p.statut)}</span></div></div>`).join("") : empty("Aucune proposition.")}</section>
  </div>`;
}

function vContenu() {
  const C = S.contenus || [];
  return `<section class="panel"><h2>Contenus</h2>${C.length ? `<div class="table-wrap"><table><thead><tr><th>Titre</th><th>Plateforme</th><th>Statut</th><th>Fichier</th></tr></thead>
    <tbody>${C.map((c) => `<tr><td>${esc(c.titre)}${ex(c)}</td><td>${esc(c.plateforme)}</td><td>${esc(c.statut)}</td><td class="mono">${c.fichier ? esc(c.fichier) : "—"}</td></tr>`).join("")}</tbody></table></div>` : empty("Aucun contenu. Lance <span class='mono'>/chef écris 3 scripts TikTok …</span>")}</section>`;
}

function vEtudes() {
  const E = S.etudes || {}, F = E.fiches || [], Q = E.quiz || [];
  const Pl = (E.planning || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  return `<div class="grid-2">
    <div style="display:grid;gap:16px;min-width:0">
      <section class="panel"><h2>Fiches de révision</h2>${F.length ? F.map((f) => `<div class="card"><div><b>${esc(f.titre)}</b>${ex(f)}</div><div class="meta">${f.ue ? `<span class="tag etudes">${esc(f.ue)}</span>` : ""}<span>${esc(f.statut).replace("_", " ")}</span>${f.fichier ? `<span class="mono">${esc(f.fichier)}</span>` : ""}</div></div>`).join("") : empty("Dépose tes cours dans os/cours/ puis lance /chef fais une fiche sur …")}</section>
      <section class="panel"><h2>Quiz & calculs de doses</h2>${Q.length ? Q.map((q) => `<div class="card"><div><b>${esc(q.titre)}</b>${ex(q)}</div><div class="meta"><span class="mono">${q.questions ?? "?"} questions</span><span>· score ${q.score == null ? "à faire" : esc(q.score)}</span></div></div>`).join("") : empty("Aucun quiz.")}</section>
    </div>
    <aside class="panel"><h2>Planning</h2>${Pl.length ? `<ul class="feed">${Pl.map((p) => `<li><span class="dot" style="background:var(--st-${p.type === "partiel" ? "sent" : p.type === "stage" ? "client" : "new"})"></span><div><time>${fmtDate(p.date)} · ${esc(p.type)}</time>${esc(p.titre)}</div></li>`).join("")}</ul>` : empty("Pas encore de dates. Donne à Jade tes dates de partiels et de stage : <span class='mono'>/chef planning …</span>")}</aside>
  </div>`;
}

const RENDER = { bureau: vBureau, carte: vCarte, taches: vTaches, prospects: vProspects, clients: vClients, contenu: vContenu, etudes: vEtudes };

function current() { const h = location.hash.slice(1); return VIEWS.includes(h) ? h : "bureau"; }
function render() {
  if (!S) return;
  const v = current();
  document.querySelectorAll("nav a").forEach((a) => a.setAttribute("aria-current", a.getAttribute("href") === "#" + v ? "page" : "false"));
  document.getElementById("view").innerHTML = RENDER[v]();
  document.querySelectorAll(".pin").forEach((g) => {
    const go = () => { selected = g.dataset.id; render(); };
    g.addEventListener("click", go);
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}
function header() {
  document.getElementById("maj").textContent = "Mis à jour le " + fmtDate(S.maj);
  const real = (arr) => (arr || []).filter((x) => !x.exemple).length;
  const working = (S.agents || []).filter((a) => a.statut === "travail").length;
  const st = [["Agents au travail", working + "/" + (S.agents || []).length], ["Prospects", real(S.prospects)], ["Clients", real(S.clients)], ["Fiches", real((S.etudes || {}).fiches)]];
  document.getElementById("links").innerHTML = (S.liens || []).map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.nom)} ↗</a>`).join("");
  document.getElementById("stats").innerHTML = st.map(([l, v]) => `<div class="stat"><span class="label">${l}</span><b>${v}</b></div>`).join("");
}

fetch("data/state.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((d) => { S = d; header(); render(); })
  .catch((e) => {
    document.getElementById("maj").textContent = "Données introuvables";
    document.getElementById("view").innerHTML = `<div class="err"><b>Impossible de lire data/state.json</b> (${esc(e.message)}). Republie le tableau de bord avec /chef pour joindre le fichier de données.</div>`;
  });
window.addEventListener("hashchange", render);
</script>
